name: Build & release
on: workflow_dispatch

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check version
        run: |
          python3 ./release-scripts/check_version.py ${{ github.ref_name }}

  build-installer:
    name: Build
    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}
    needs: check-version
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r installer/requirements.txt
      - name: Build
        uses: Nuitka/Nuitka-Action@main
        if: ${{ matrix.os != 'windows-latest' }}
        with:
          nuitka-version: main
          script-name: installer/installer.py
          mode: onefile
          disable-cache: true
          include-data-files: "installer/installer.json=installer.json"
      - name: Build (Windows)
        uses: Nuitka/Nuitka-Action@main
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          nuitka-version: main
          script-name: installer/installer.py
          mode: onefile
          disable-cache: true
          windows-uac-admin: true
          include-data-files: "installer/installer.json=installer.json"
      - name: Build (macOS Intel)
        uses: Nuitka/Nuitka-Action@main
        if: ${{ matrix.os == 'macos-latest' }}
        with:
          nuitka-version: main
          script-name: installer/installer.py
          macos-target-arch: x86_64
          mode: onefile
          disable-cache: true
          output-dir: build_intel
          include-data-files: "installer/installer.json=installer.json"
      - name: Rename (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: mv build/installer.bin build/noir-installer-linux
      - name: Rename (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run:
          mv build/installer.bin build/noir-installer-macos-arm64;
          mv build_intel/installer.bin build_intel/noir-installer-macos-intel
      - name: Rename (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter installer.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Nuitka did not produce installer.exe' }
          Move-Item -Path $exe.FullName -Destination build/noir-installer-windows.exe
      - name: Upload package (macOS arm64)
        uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'macos-latest' }}
        with:
          name: noir-installer-macos-arm64
          path: build/noir-installer-macos-arm64
          retention-days: 7
      - name: Upload package (macOS Intel)
        uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'macos-latest' }}
        with:
          name: noir-installer-macos-x64
          path: build_intel/noir-installer-macos-intel
          retention-days: 7
      - name: Upload package (Linux)
        uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          name: noir-installer-linux
          path: build/noir-installer-linux
          retention-days: 7
      - name: Upload package (Windows)
        uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          name: noir-installer-windows
          path: build/noir-installer-windows.exe
          retention-days: 7
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-installer
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Get current version
        run: python3 ./release-scripts/get_version.py
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Create GitHub release
        uses: ncipollo/release-action@v1.21.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.RAW_VERSION }}
          tag: ${{ env.VERSION }}
          commit: ${{ github.ref }}
          draft: true
          skipIfReleaseExists: true
          artifactErrorsFailBuild: true
          artifacts: 'noir-installer-macos-arm64/noir-installer-macos-arm64,
            noir-installer-macos-x64/noir-installer-macos-intel,
            noir-installer-linux/noir-installer-linux,
            noir-installer-windows/noir-installer-windows.exe'
  publish:
    name: "Publish release"
    runs-on: ubuntu-latest
    needs: [ release ]
    environment: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Write update manifest
        run: python3 ./release-scripts/write_manifest.py
      - name: Commit and push manifest
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "<>"
          git add updates
          if git diff --cached --quiet; then
            echo "Manifest unchanged, nothing to push."
          else
            git commit -m "Publish update manifest"
            git push
          fi
